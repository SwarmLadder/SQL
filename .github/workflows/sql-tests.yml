name: Validate SQL course
on: [push, pull_request]
jobs:
  sqlite-course:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check runnable SQLite lessons, solutions, worked examples, and projects
        run: python tools/run_sql.py --check
      - name: Run dataset and course tests
        run: python -m unittest discover -s tests -v

      - name: Validate backend interview reference queries
        run: python tools/interview_practice.py verify-reference

      - name: Run backend hands-on examples
        run: |
          python -m backend.lab
          python -m backend.query_patterns

      - name: Grade reference schema designs
        run: python tools/schema_practice.py verify-reference

      - name: Grade reference practice answers on both fixtures
        run: python tools/practice.py verify-reference

      - name: Practice tables are up to date
        run: python tools/practice_docs.py --check
