name: Validate SQL course
on: [push, pull_request]
jobs:
  sqlite-course:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check runnable SQLite lessons, solutions, and projects
        run: python tools/run_sql.py --check
      - name: Run dataset and course tests
        run: python -m unittest discover -s tests -v

      - name: Validate backend interview reference queries
        run: python tools/interview_practice.py verify-reference
